{% extends "base.html" %}

{% block content %}
  <section class="page-section">
    <div class="card card-centered">
      <h1 class="page-title">Welcome to TrialTracker</h1>
      <p class="page-lead">
        A lightweight dashboard to track SaaS trials, avoid surprise renewals,
        and understand your potential subscription spend.
      </p>

      <form method="post" class="form-grid">
        <div class="form-field">
          <label for="owner_name">Your name</label>
          <input
            type="text"
            id="owner_name"
            name="owner_name"
            placeholder="Alex at Beachside Studio"
            required
          />
        </div>

        <div class="form-field">
          <label for="owner_email">Notification email</label>
          <input
            type="email"
            id="owner_email"
            name="owner_email"
            placeholder="you@example.com"
            required
          />
          <p class="field-hint">
            We'll send you email reminders 7 days and 1 day before each trial
            expires.
          </p>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          Save and go to dashboard
        </button>
      </form>
    </div>
  </section>
{% endblock %}
