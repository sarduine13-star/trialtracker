{% extends "base.html" %}

{% block content %}
  <section class="page-section">
    <div class="card card-centered">
      <h1 class="page-title">
        {% if trial %}Edit trial{% else %}Add a trial{% endif %}
      </h1>
      <p class="page-lead">
        Track one SaaS trial: we’ll calculate days remaining and include it in your potential monthly spend.
      </p>

      <form method="post" class="form-grid" id="trial-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-field form-field-full">
          <label>Type</label>
          <div class="radio-row">
            <label class="radio-option">
              <input
                type="radio"
                name="kind"
                value="trial"
                onchange="updateTrialFormLabels()"
                {% if not trial or trial.kind != "subscription" %}checked{% endif %}
              />
              Trial
            </label>
            <label class="radio-option">
              <input
                type="radio"
                name="kind"
                value="subscription"
                onchange="updateTrialFormLabels()"
                {% if trial and trial.kind == "subscription" %}checked{% endif %}
              />
              Subscription
            </label>
          </div>
        </div>

        <div class="form-field" id="billing_cycle_field" style="display: none;">
          <label for="billing_cycle">Billing recurrence</label>
          <select id="billing_cycle" name="billing_cycle" onchange="updateTrialFormLabels()">
            <option value="monthly" {% if trial and trial.billing_cycle == "monthly" %}selected{% endif %}>Monthly</option>
            <option value="yearly" {% if trial and trial.billing_cycle == "yearly" %}selected{% endif %}>Yearly</option>
          </select>
        </div>

        <div class="form-field">
          <label for="product_name">Product name</label>
          <input
            type="text"
            id="product_name"
            name="product_name"
            value="{{ trial.product_name if trial else '' }}"
            placeholder="Figma, Notion, Linear..."
            required
          />
        </div>

        <div class="form-field">
          <label for="vendor">Vendor / account</label>
          <input
            type="text"
            id="vendor"
            name="vendor"
            value="{{ trial.vendor if trial else '' }}"
            placeholder="Company or workspace name"
          />
        </div>

        <div class="form-field">
          <label for="monthly_cost" id="cost_label">Monthly cost if you keep it</label>
          <div class="input-with-prefix">
            <span class="prefix">$</span>
            <input
              type="number"
              step="0.01"
              min="0"
              id="monthly_cost"
              name="monthly_cost"
              value="{{ trial.monthly_cost if trial else '' }}"
              placeholder="29.00"
              required
            />
          </div>
        </div>

        <div class="form-field">
          <label for="trial_end_date" id="date_label">Trial end date</label>
          <input
            type="date"
            id="trial_end_date"
            name="trial_end_date"
            value="{{ trial.trial_end_date if trial else '' }}"
            required
          />
        </div>

        <div class="form-field form-field-full">
          <label for="notes">Notes (optional)</label>
          <textarea
            id="notes"
            name="notes"
            rows="3"
            placeholder="What are you testing? Who owns the tool? Any decision deadline before renewal?"
          >{{ trial.notes if trial else '' }}</textarea>
        </div>

        <div class="form-actions">
          <a href="{{ url_for('dashboard') }}" class="btn btn-ghost">
            Cancel
          </a>
          <button type="submit" class="btn btn-primary">
            {% if trial %}Save changes{% else %}Save trial{% endif %}
          </button>
        </div>
      </form>
    </div>
  </section>

  <script>
    function updateTrialFormLabels() {
      const form = document.getElementById("trial-form");
      const kind = form.querySelector('input[name="kind"]:checked').value;
      const billingCycle = document.getElementById("billing_cycle").value;
      const billingField = document.getElementById("billing_cycle_field");
      const dateLabel = document.getElementById("date_label");
      const costLabel = document.getElementById("cost_label");

      if (kind === "subscription") {
        billingField.style.display = "";
        dateLabel.textContent = "Renewal date";
        costLabel.textContent = billingCycle === "yearly" ? "Yearly cost" : "Monthly cost";
      } else {
        billingField.style.display = "none";
        dateLabel.textContent = "Trial end date";
        costLabel.textContent = "Monthly cost if you keep it";
      }
    }

    document.addEventListener("DOMContentLoaded", updateTrialFormLabels);
  </script>
{% endblock %}
