{% extends "base.html" %}

{% block content %}
  <section class="page-section">
    <div class="card card-centered">
      <h1 class="page-title">Create your account</h1>
      <p class="page-lead">
        Track free trials, see what renews next, and understand your potential subscription spend.
      </p>

      <form method="post" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-field form-field-full">
          <label for="name">Your name</label>
          <input
            type="text"
            id="name"
            name="name"
            value="{{ name or '' }}"
            placeholder="Alex at Beachside Studio"
            required
          />
        </div>

        <div class="form-field form-field-full">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            value="{{ email or '' }}"
            placeholder="you@example.com"
            required
          />
          <p class="field-hint">
            We'll send you email reminders 7 days and 1 day before each trial expires.
          </p>
        </div>

        <div class="form-field form-field-full">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
            minlength="8"
            required
          />
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </div>
      </form>

      <p class="field-hint" style="margin-top: 1rem; text-align: center;">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
      </p>
    </div>
  </section>
{% endblock %}
